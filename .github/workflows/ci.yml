name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Check the package installs and the CLI starts
        run: |
          python -m pip install --quiet .
          togakuren --version
          togakuren --help

  no-data-committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse collected data in the repository
        shell: bash
        run: |
          set -euo pipefail
          offenders=$(git ls-files -- '*.sqlite3' '*.db' '*.csv' 'data/**' 'reports/**' || true)
          if [ -n "$offenders" ]; then
            echo "collected data must not be committed; see docs/DATA_POLICY.en.md"
            echo "$offenders"
            exit 1
          fi
          echo "no collected data in the tree"
