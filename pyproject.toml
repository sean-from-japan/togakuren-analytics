[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "togakuren-analytics"
version = "0.1.0"
description = "Collect and analyse Tokyo University Football Association match records"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["football", "soccer", "analytics", "scraping", "sqlite", "japan"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
]

[project.scripts]
togakuren = "togakuren.cli:main"

[tool.setuptools]
packages = ["togakuren"]

[tool.setuptools.package-data]
togakuren = ["schema.sql"]
